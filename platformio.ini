; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Pull src/*.cpp (except main.cpp) into `pio test` builds too, so classes
; like WeatherDisplay are linkable from test/.
test_build_src = yes
lib_deps =
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.11
	adafruit/Adafruit GFX Library@^1.12.6
	bblanchon/ArduinoJson@^7.0.0
	tzapu/WiFiManager

; Host build - no ESP32 required. Runs the pure-logic suites (the helpers
; in lib/*) as normal desktop executables:  pio test -e native
; The *_live suites need real Wi-Fi/hardware, so they're excluded here;
; every pure suite also runs under esp32dev (its runner is split on the
; ARDUINO macro), so on-device `pio test` still shows them too.
[env:native]
platform = native
test_framework = unity
test_ignore =
	test_weather_display_live
